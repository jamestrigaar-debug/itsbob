[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itsbob"
version = "0.3.0"
description = "A memory-backed personal assistant: hybrid recall, gated tool use, a cheap-to-premium model ladder, and a task daemon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
]

[project.optional-dependencies]
# All three providers speak the OpenAI wire format, so langchain is not required.
# Install this extra only if you want to wrap the router in a LangChain chain.
langchain = ["langchain>=0.3", "langchain-openai>=0.2"]
gui = ["flask>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Optional accelerator. Recall works without it by scanning the most recent
# `vector_scan_limit` vectors in pure Python; with numpy the whole table is
# compared in one matrix multiply, which matters past a few thousand memories.
speed = ["numpy>=1.24"]
# Pillow lets `describe_image` downscale before uploading and `image_info` read
# dimensions locally. Both tools work without it — large images are refused
# rather than resized, and image_info falls back to the file's own metadata.
vision = ["pillow>=10.0"]
# Driving a real browser: `read_page` on JavaScript-heavy sites, and the
# DeepSeek bridge. Both degrade without it — to a plain fetch, and to the
# xdotool path or nothing.
browser = ["playwright>=1.40"]
all = ["flask>=3.0", "numpy>=1.24", "pillow>=10.0"]

[project.scripts]
itsbob = "itsbob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itsbob = ["templates/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness and real-bug rules, not style opinions. The two that have
# actually caught things here: B905 (zip without strict= silently truncates,
# which hid unembedded memories) and B023 (a closure over a loop variable).
select = ["F", "E4", "E7", "E9", "B", "PLE", "UP032", "RUF010"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
