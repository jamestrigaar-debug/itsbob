[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itsbob"
version = "0.3.0"
description = "A memory-backed personal assistant: hybrid recall, gated tool use, a cheap-to-premium model ladder, and a task daemon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
]

[project.optional-dependencies]
# All three providers speak the OpenAI wire format, so langchain is not required.
# Install this extra only if you want to wrap the router in a LangChain chain.
langchain = ["langchain>=0.3", "langchain-openai>=0.2"]
gui = ["flask>=3.0"]
dev = ["pytest>=8.0"]
# Optional accelerator. Recall works without it by scanning the most recent
# `vector_scan_limit` vectors in pure Python; with numpy the whole table is
# compared in one matrix multiply, which matters past a few thousand memories.
speed = ["numpy>=1.24"]
all = ["flask>=3.0", "numpy>=1.24"]

[project.scripts]
itsbob = "itsbob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itsbob = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
