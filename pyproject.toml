[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itsbob"
version = "0.2.0"
description = "A complexity-based hierarchical LLM router (Classify First, Execute Cheapest, Fallback Gracefully) with an energy-metered character simulation built on it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
]

[project.optional-dependencies]
# All three providers speak the OpenAI wire format, so langchain is not required.
# Install this extra only if you want to wrap the router in a LangChain chain.
langchain = ["langchain>=0.3", "langchain-openai>=0.2"]
gui = ["flask>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
itsbob = "itsbob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itsbob = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
